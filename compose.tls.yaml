# TLS overlay for the web front (R5 packaging). Terminates HTTPS at nginx.
#
#   scripts/gen_selfsigned.sh                     # once, for a LAN install
#   docker compose -f compose.yaml -f compose.tls.yaml up -d
#
# :8443 serves HTTPS; :8080 redirects to it. Swap the self-signed pair in
# deploy/certs/ for the bank's own CA-issued certificate when they have one —
# same filenames, no rebuild.
services:
  web:
    ports:
      - "${KPIGO_WEB_PORT:-8080}:8080"
      - "${KPIGO_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/nginx/kpigo-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
