# kpiGo web front with TLS terminated here (R5 packaging). Mounted in place of
# kpigo.conf by compose.tls.yaml. :8080 redirects to :8443, which serves the UI
# and proxies /api to the app on the same origin so the session cookie and CSRF
# token keep working over HTTPS. Certificates come from deploy/certs/ (a
# self-signed pair for a LAN install, or the bank's own CA-issued cert).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Everything moves to HTTPS. Nothing is served over plain HTTP.
    return 308 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 64m;  # feed uploads go through feed.run as base64

    ssl_certificate     /etc/nginx/certs/kpigo.crt;
    ssl_certificate_key /etc/nginx/certs/kpigo.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kpigo_tls:10m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    # Nothing loads from outside the install: no CDNs, no fonts, no telemetry.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 330s;  # a little over KPIGO_PULL_TIMEOUT_SECONDS
    }

    # Hashed bundles never change; index.html always revalidates.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
