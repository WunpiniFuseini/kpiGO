[project]
name = "kpigo"
version = "0.1.0"
description = "kpiGo: on-premise performance tracking for financial institutions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.3,<2",
    "pydantic>=2.9,<3",
    "celery[redis]>=5.4,<6",
    "psycopg[binary]>=3.2,<4",
    "opentelemetry-api>=1.27,<2",
    "gunicorn>=23",
    "uvicorn>=0.30",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "celery-types>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kpigo"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kpigo.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
# E501: the formatter owns line length. RUF012: Django's Meta/Migration idiom.
# RUF001-003: the docs use typographic characters (×, —) deliberately.
# DJ001: the schema uses NULL for absent text (region_code null = org-wide row).
ignore = ["E501", "RUF012", "RUF001", "RUF002", "RUF003", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"kpigo/*/migrations/*" = ["I001"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kpigo.action", "kpigo.action.*"]
strict = true

[tool.django-stubs]
django_settings_module = "kpigo.settings"
