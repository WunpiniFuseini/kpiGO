# kpiGo single-node stack. Offline-friendly: no service reaches the internet.
# nginx (TLS, static) joins in R5 packaging; until then the app listens on 8000.

x-app: &app
  build:
    context: .
    target: ${KPIGO_BUILD_TARGET:-runtime}
  image: kpigo/app:${KPIGO_VERSION:-dev}
  env_file:
    - path: .env
      required: false
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-kpigo}
    POSTGRES_USER: ${POSTGRES_USER:-kpigo}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpigo}
    REDIS_URL: redis://redis:6379/0
    KPIGO_SECRET_KEY: ${KPIGO_SECRET_KEY:-change-me-before-install}
    KPIGO_SECURE_COOKIES: ${KPIGO_SECURE_COOKIES:-false}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [kpigo]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kpigo}
      POSTGRES_USER: ${POSTGRES_USER:-kpigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpigo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kpigo]
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kpigo]
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${KPIGO_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 10s
      timeout: 10s
      retries: 12

  worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "kpigo", "worker", "--loglevel", "INFO"]

  beat:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "kpigo", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]

volumes:
  pgdata:

networks:
  kpigo:
