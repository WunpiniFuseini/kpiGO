# kpiGo single-node stack. Offline-friendly: no service reaches the internet.
# Users open the web front (port 8080), which serves the UI and proxies /api to
# the app. TLS joins in R5 packaging; until then the app also listens on 8000.

x-app: &app
  build:
    context: .
    target: ${KPIGO_BUILD_TARGET:-runtime}
  image: kpigo/app:${KPIGO_VERSION:-dev}
  env_file:
    - path: .env
      required: false
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-kpigo}
    POSTGRES_USER: ${POSTGRES_USER:-kpigo}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpigo}
    REDIS_URL: redis://redis:6379/0
    KPIGO_SECRET_KEY: ${KPIGO_SECRET_KEY:-change-me-before-install}
    KPIGO_SECURE_COOKIES: ${KPIGO_SECURE_COOKIES:-false}
    KPIGO_DROP_ROOT: /var/lib/kpigo/drop
    KPIGO_LICENCE_FILE: /var/lib/kpigo/licence/kpigo.lic
    KPIGO_BACKUP_DIR: /var/lib/kpigo/backups
  # Drop-folder feeds read here. A client usually binds its network share instead.
  # The licence file licence.activate writes, and backups, must survive restarts
  # and upgrades.
  volumes:
    - drop:/var/lib/kpigo/drop
    - licence:/var/lib/kpigo/licence
    - backups:/var/lib/kpigo/backups
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [kpigo]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kpigo}
      POSTGRES_USER: ${POSTGRES_USER:-kpigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpigo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kpigo]
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kpigo]
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${KPIGO_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 10s
      timeout: 10s
      retries: 12

  worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "kpigo", "worker", "--loglevel", "INFO"]

  beat:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "kpigo", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: kpigo/web:${KPIGO_VERSION:-dev}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${KPIGO_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [kpigo]
    restart: unless-stopped

volumes:
  pgdata:
  drop:
  licence:
  backups:

networks:
  kpigo:
